openapi: 3.0.3
info:
  title: SIPUS-Del Web API & SOAP Services
  description: |
    Spesifikasi Kontrak Resmi Web API RESTful v1 dan Layanan SOAP Legacy SIPUS-Del (Sistem Informasi Perpustakaan Kampus Del).
    
    Fitur Utama:
    - **Arsitektur Stateless Token Sanctum**: Otentikasi API via HTTP Bearer Token.
    - **Hypermedia Controls (HATEOAS)**: Kontrol dinamis link navigasi sesuai status ketersediaan stok & status peminjaman.
    - **Standarisasi Kesalahan RFC 7807 (Problem Details for HTTP APIs)**: Respon error seragam dengan `type`, `title`, `status`, `detail`, dan `instance`.
    - **Sirkulasi Peminjaman Atomik (ACID Concurrency)**: Transaksi peminjaman dan pengembalian buku terlindungi isolasi `lockForUpdate()`.
    - **Integrasi Layanan Eksternal (REST Consumer)**: Pengayaan metadata buku langsung dari OpenLibrary REST API publik.
    - **Layanan Legacy SOAP**: Pengecekan bebas pinjaman (Clearance Check) untuk sistem kelulusan/yudisium kampus.
  version: 1.0.0
  contact:
    name: Arion Manurung
    email: 12s24014@students.del.ac.id

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Server Pengembangan Lokal (Localhost Development)
  - url: http://localhost:8000/api/v1
    description: Localhost Alias

paths:
  # ============================================================================
  # 1. AUTENTIKASI TOKEN STATELESS (SANCTUM)
  # ============================================================================
  /auth/login:
    post:
      summary: Login Pustakawan & Terbitkan Bearer Token
      description: Memvalidasi kredensial pustakawan dan menerbitkan token Sanctum plaintext untuk otentikasi stateless pada endpoint terproteksi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: pustakawan@del.ac.id
                password:
                  type: string
                  format: password
                  example: password123
                device_name:
                  type: string
                  example: Postman-Client-v1
      responses:
        '200':
          description: Berhasil login dan memperoleh Bearer Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Kredensial tidak valid (RFC 7807 Problem Details).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Kesalahan validasi format input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/me:
    get:
      summary: Dapatkan Profil Pengguna Aktif
      description: Mengambil data identitas pustakawan yang terautentikasi oleh Bearer Token saat ini.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /auth/logout:
    post:
      summary: Logout & Cabut Token Saat Ini
      description: Mencabut dan menghapus token Sanctum aktif dari database secara permanen.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Bearer token berhasil dicabut. Sesi API telah diakhiri." }
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  # ============================================================================
  # 2. KATALOG BUKU (REST PROVIDER & HATEOAS)
  # ============================================================================
  /bukus:
    get:
      summary: Daftar Koleksi Buku Terpaginasi
      description: Mengambil katalog buku dengan dukungan filter pencarian, kategori, ketersediaan, pengurutan, serta kontrol hypermedia HATEOAS. Bebas N+1 Query.
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
          description: Nomor halaman paginasi
        - in: query
          name: per_page
          schema: { type: integer, default: 10, maximum: 50 }
          description: Jumlah item per halaman
        - in: query
          name: search
          schema: { type: string }
          description: Kata kunci pencarian (judul, penulis, isbn, penerbit)
        - in: query
          name: kategori_id
          schema: { type: integer }
          description: Filter berdasarkan ID kategori
        - in: query
          name: tersedia
          schema: { type: boolean }
          description: Filter stok (true = stok > 0, false = stok 0)
        - in: query
          name: sort
          schema: { type: string, enum: [judul, penulis, tahun_terbit, stok, created_at], default: created_at }
        - in: query
          name: dir
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Katalog buku berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Buku'
                  meta:
                    $ref: '#/components/schemas/MetaPagination'

    post:
      summary: Tambah Buku Baru ke Inventaris
      description: Menambahkan judul buku baru ke inventaris perpustakaan. Mengembalikan status 201 Created dan header Location.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat.
          headers:
            Location:
              schema: { type: string }
              description: URL canonical detail buku yang baru dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Buku'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'

  /bukus/{id}:
    get:
      summary: Detail Satu Buku Berdasarkan ID atau ISBN
      description: Mengambil rincian data buku lengkap dengan relasi kategori, riwayat peminjaman, serta link dinamis HATEOAS.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ID angka atau Nomor ISBN buku
      responses:
        '200':
          description: Detail buku ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Buku'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

    put:
      summary: Ganti Representasi Data Buku Secara Penuh (PUT Semantics)
      description: Menggantikan seluruh representasi atribut buku secara penuh. Seluruh field wajib dikirimkan.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Buku berhasil diganti secara penuh (PUT).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Buku'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'

    patch:
      summary: Perbarui Sebagian Atribut Buku (PATCH Semantics)
      description: Memperbarui hanya atribut tertentu yang dikirim pada payload JSON tanpa mempengaruhi atribut lainnya.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuPatchInput'
      responses:
        '200':
          description: Atribut buku berhasil diperbarui sebagian (PATCH).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Buku'
        '400':
          description: Payload PATCH kosong tanpa atribut yang ingin diubah.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

    delete:
      summary: Hapus Buku dari Katalog
      description: Menghapus data buku. Ditolak dengan kode status 409 Conflict jika terdapat peminjaman aktif yang belum dikembalikan.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Buku berhasil dihapus (No Content).
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Konflik integritas bisnis (Buku sedang memiliki peminjaman aktif).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # ============================================================================
  # 3. REST API CONSUMER (INTEGRASI OPENLIBRARY)
  # ============================================================================
  /bukus/{id}/referensi-eksternal:
    get:
      summary: Ambil Metadata Pengayaan Eksternal via OpenLibrary REST API
      description: Layanan REST Consumer yang menghubungi API eksternal OpenLibrary secara real-time berdasarkan nomor ISBN buku lokal.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ID atau ISBN buku lokal
      responses:
        '200':
          description: Respon pengayaan eksternal berhasil diperoleh.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      local_book: { type: object }
                      external_found: { type: boolean }
                      source: { type: string }
                      title: { type: string }
                      authors: { type: array, items: { type: string } }
                      publishers: { type: array, items: { type: string } }
                      cover_url: { type: string, nullable: true }
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  # ============================================================================
  # 4. SIRKULASI PEMINJAMAN (ACID CONCURRENCY & LOCKFORUPDATE)
  # ============================================================================
  /peminjamans:
    get:
      summary: Daftar Transaksi Peminjaman Terpaginasi
      description: Mengambil seluruh rekaman transaksi peminjaman buku dengan filter status, NIM, atau kata kunci pencarian.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 10 }
        - in: query
          name: status
          schema: { type: string, enum: [dipinjam, dikembalikan] }
        - in: query
          name: nim
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Riwayat transaksi berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Peminjaman'
                  meta:
                    $ref: '#/components/schemas/MetaPagination'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

    post:
      summary: Buat Transaksi Peminjaman Baru (ACID Atomik & lockForUpdate)
      description: |
        Mencatat peminjaman baru dalam blok transaksi basis data terisolasi.
        
        Aturan Integritas:
        - Kunci eksklusif baris buku (`SELECT ... FOR UPDATE`).
        - Ditolak dengan `422 Unprocessable Entity` jika stok = 0.
        - Ditolak dengan `409 Conflict` jika mahasiswa (NIM) sedang meminjam buku yang sama dan belum mengembalikannya.
        - Mengurangi stok secara atomik (-1) dan menerbitkan header `Location`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeminjamanInput'
      responses:
        '201':
          description: Peminjaman berhasil dicatat secara atomik.
          headers:
            Location:
              schema: { type: string }
              description: URL canonical detail peminjaman
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          description: Konflik - Mahasiswa memiliki peminjaman aktif untuk buku ini.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Stok buku habis (0) atau kesalahan validasi form.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /peminjamans/{id}:
    get:
      summary: Detail Transaksi Peminjaman
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ID atau kode_pinjam transaksi
      responses:
        '200':
          description: Detail peminjaman ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /peminjamans/{id}/kembalikan:
    patch:
      summary: Proses Pengembalian Buku (ACID Atomik & lockForUpdate)
      description: |
        Memproses penyelesaian pinjaman dan pengembalian buku:
        - Kunci baris peminjaman dan baris buku (`SELECT ... FOR UPDATE`).
        - Ditolak dengan `409 Conflict` jika buku sudah berstatus `dikembalikan`.
        - Memperbarui status transaksi menjadi `dikembalikan` dan mengisi `tanggal_kembali`.
        - Memulihkan kuota stok buku secara atomik (+1).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ID angka atau Kode Pinjam
      responses:
        '200':
          description: Pengembalian buku berhasil diproses dan stok dipulihkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Konflik - Buku sudah pernah dikembalikan sebelumnya.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Menerima plaintext token yang dihasilkan dari `POST /api/v1/auth/login`.

  responses:
    UnauthorizedProblem:
      description: Autentikasi Bearer token tidak valid atau hilang.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundProblem:
      description: Entitas sumber daya tidak ditemukan.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Kegagalan validasi atribut input payload.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      description: Spesifikasi standar representasi error RFC 7807 (Problem Details for HTTP APIs)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          example: "http://localhost/docs/errors/book-not-found"
        title:
          type: string
          example: "Resource Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Buku dengan ID '999' tidak ditemukan di katalog perpustakaan."
        instance:
          type: string
          example: "/api/v1/bukus/999"
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "isbn" }
              reason: { type: string, example: "Nomor ISBN sudah terdaftar di sistem." }

    TokenResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Otentikasi berhasil. Bearer token diterbitkan." }
        data:
          type: object
          properties:
            token:
              type: string
              example: "1|7xABc998zKLm0P..."
            token_type:
              type: string
              example: "Bearer"
            user:
              $ref: '#/components/schemas/User'

    UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Data profil pengguna berhasil diambil." }
        data:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Pustakawan Del" }
        email: { type: string, example: "pustakawan@del.ac.id" }
        role: { type: string, example: "pustakawan" }

    MetaPagination:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 10 }
        total_items: { type: integer, example: 22 }
        total_pages: { type: integer, example: 3 }
        links:
          type: object
          properties:
            first: { type: string }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
            last: { type: string }

    Buku:
      type: object
      properties:
        id: { type: integer, example: 1 }
        isbn: { type: string, example: "978-602-03-8829-8" }
        judul: { type: string, example: "Arsitektur Web Terdistribusi & RESTful Services" }
        penulis: { type: string, example: "Martin Fowler" }
        penerbit: { type: string, example: "Addison-Wesley" }
        tahun_terbit: { type: integer, example: 2023 }
        stok: { type: integer, example: 5 }
        ketersediaan: { type: string, enum: [TERSEDIA, HABIS], example: "TERSEDIA" }
        sinopsis: { type: string, nullable: true }
        kategori:
          type: object
          properties:
            id: { type: integer, example: 1 }
            kode_kategori: { type: string, example: "TEK" }
            nama_kategori: { type: string, example: "Teknologi Informasi" }
        total_kali_dipinjam: { type: integer, example: 14 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links:
          type: object
          description: Kontrol Hypermedia HATEOAS Dinamis
          properties:
            self:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1" }
                method: { type: string, example: "GET" }
            update_full:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1" }
                method: { type: string, example: "PUT" }
            update_partial:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1" }
                method: { type: string, example: "PATCH" }
            delete:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1" }
                method: { type: string, example: "DELETE" }
            referensi_eksternal:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1/referensi-eksternal" }
                method: { type: string, example: "GET" }
            pinjam_buku:
              type: object
              description: Hadir hanya jika stok > 0
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/peminjamans" }
                method: { type: string, example: "POST" }
                description: { type: string }

    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: { type: string, example: "978-602-0000-88-8" }
        judul: { type: string, example: "Rekayasa Perangkat Lunak Modern" }
        penulis: { type: string, example: "Roger S. Pressman" }
        penerbit: { type: string, example: "McGraw-Hill" }
        tahun_terbit: { type: integer, example: 2024 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, example: 10 }
        sinopsis: { type: string, example: "Buku acuan rekayasa sistem terdistribusi." }

    BukuPatchInput:
      type: object
      properties:
        isbn: { type: string }
        judul: { type: string }
        penulis: { type: string }
        penerbit: { type: string }
        tahun_terbit: { type: integer }
        kategori_id: { type: integer }
        stok: { type: integer }
        sinopsis: { type: string }

    Peminjaman:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_pinjam: { type: string, example: "PJ-20261109-KTQZ6" }
        buku_id: { type: integer, example: 1 }
        nim_peminjam: { type: string, example: "12S24014" }
        nama_peminjam: { type: string, example: "Arion Manurung" }
        tanggal_pinjam: { type: string, format: date, example: "2026-11-09" }
        tanggal_jatuh_tempo: { type: string, format: date, example: "2026-11-16" }
        tanggal_kembali: { type: string, format: date, nullable: true }
        status: { type: string, enum: [dipinjam, dikembalikan], example: "dipinjam" }
        status_label: { type: string, example: "SEDANG DIPINJAM" }
        buku:
          type: object
          properties:
            id: { type: integer }
            isbn: { type: string }
            judul: { type: string }
            penulis: { type: string }
            stok: { type: integer }
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/peminjamans/1" }
                method: { type: string, example: "GET" }
            buku_detail:
              type: object
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/bukus/1" }
                method: { type: string, example: "GET" }
            kembalikan_buku:
              type: object
              description: Hadir hanya jika status peminjaman bernilai 'dipinjam'
              properties:
                href: { type: string, example: "http://127.0.0.1:8000/api/v1/peminjamans/1/kembalikan" }
                method: { type: string, example: "PATCH" }

    PeminjamanInput:
